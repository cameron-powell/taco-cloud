spring:
    application:
        name: taco-cloud
    
    datasource:
        generate-unique-name: false
        name: tacocloud

taco:
    orders:
        pageSize: 10

logging:
  level:
    tacos: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://localhost/tacocloud
    username: tacouser
    password: tacopassword

logging:
  level:
    tacos: WARN